services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: temporal-game-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - temporal-network

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: temporal-game-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email hugo.o.sousa@inesctec.pt -d temporal-game.inesctec.pt --agree-tos
    depends_on:
      - nginx

  # Temporal Tagger Service
  temporal-tagger:
    image: hmosousa/tei2go-en:latest
    container_name: temporal-tagger
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - temporal-network

  # Backend Flask Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: temporal-game-backend
    expose:
      - "5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-temporal_game_secret_production}
      - TEMPORAL_TAGGER_URL=http://temporal-tagger:8000
    volumes:
      - .:/app
      - /app/.venv
      - /app/.conda
    depends_on:
      - temporal-tagger
    restart: unless-stopped
    networks:
      - temporal-network

  # Frontend Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: temporal-game-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://temporal-game.inesctec.pt
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - temporal-network

networks:
  temporal-network:
    driver: bridge 