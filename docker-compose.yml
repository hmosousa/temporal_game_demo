services:
  # Temporal Tagger Service
  temporal-tagger:
    image: hmosousa/tei2go-en:latest
    container_name: temporal-tagger
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - temporal-network

  # Backend Flask Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: temporal-game-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-temporal_game_secret}
      - TEMPORAL_TAGGER_URL=http://temporal-tagger:8000
    volumes:
      - .:/app
      - /app/.venv
      - /app/.conda
    depends_on:
      - temporal-tagger
    restart: unless-stopped
    networks:
      - temporal-network

  # Frontend Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: temporal-game-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - temporal-network

volumes:
  node_modules:

networks:
  temporal-network:
    driver: bridge 